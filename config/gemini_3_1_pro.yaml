defaults:
  - base_config/eval_config
  - _self_

model:
  provider: gemini
  model_alias: gemini-3.1-pro-preview
  model: gemini-3.1-pro-preview
  api_key: ${GEMINI_API_KEY}
  temperature: 0.2

benchmark:
  temperature: 0.2
  num_iter: 1
  batch_size: 50
  max_retries: 5

judge:
  model:
    provider: openai
    model: gpt-4.1
    base_url: https://api.openai.com/v1
    api_key: ${OPENAI_API_KEY}
  generation_params:
    temperature: 0.3
    max_tokens: 12288
    top_p: 1.0
