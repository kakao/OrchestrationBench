defaults:
  - base_config/eval_config
  - _self_

model:
  provider: openai
  model_alias: gpt-5.4
  model: gpt-5.4
  base_url: https://api.openai.com/v1
  api_key: ${OPENAI_API_KEY}
  temperature: 0.2

benchmark:
  temperature: 0.2
  num_iter: 3
  batch_size: 20
  max_retries: 10

judge:
  model:
    provider: openai
    model: gpt-4.1
    base_url: https://api.openai.com/v1
    api_key: ${OPENAI_API_KEY}
  generation_params:
    temperature: 0.3
    max_tokens: 12288
    top_p: 1.0
